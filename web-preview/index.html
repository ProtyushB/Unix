<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unix · Screen Preview</title>
    <script>
      // React Native / RN-web libraries expect these Node-ish globals to exist.
      // Define them before any module loads so stray `global` / `process.env`
      // references never throw in the browser.
      window.global = window;
      window.process = window.process || { env: { NODE_ENV: 'development' } };
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      #root { display: flex; }
      * { box-sizing: border-box; }

      /* react-native-svg web fix — full-bleed gradient backdrops.
         The app renders page gradients as <Svg style={StyleSheet.absoluteFill}>.
         On native that stretches to fill; on web react-native-svg never sets a
         width/height, so the <svg> falls back to its intrinsic default (300x150)
         and the gradient paints only a small patch — leaving a hard seam where
         the flat background takes over.
         Sized icons (lucide, etc.) always carry explicit width/height attributes,
         so :not([width]):not([height]) targets only these fill layers. */
      svg:not([width]):not([height]) { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
