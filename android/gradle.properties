# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
#
# Tuned for the shared build server, which now runs SIX Spring backends (dev + live)
# alongside Jenkins on 7.6GB. At -Xmx4096m with 8 workers this build peaked at ~3.3GB RSS
# and the kernel OOM-killed it:
#   Out of memory: Killed process (java) anon-rss:3312916kB  jenkins.service
# Parallelism was the bigger multiplier, so it is cut hard and the heap only moderately.
# Builds are slower but they finish. Raise these again only if the box gets more RAM.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.workers.max=2

# Kotlin in-project parallelism off for the same reason — it multiplies peak memory
# across an Expo/RN module set with many source sets.
kotlin.parallel.tasks.in.project=false

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=arm64-v8a

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# ─── Release signing ─────────────────────────────────────────────────────────
#
# The four MYAPP_RELEASE_* properties are deliberately NOT here. This file is
# git-tracked in a PUBLIC repository, so anything written here is published.
#
# They live in the per-machine Gradle home instead, which Gradle merges into
# project properties automatically — no build flags, no Jenkinsfile plumbing:
#
#     ~/.gradle/gradle.properties          (your laptop)
#     /var/lib/jenkins/.gradle/gradle.properties   (the CI box, user `jenkins`)
#
# with:
#
#     MYAPP_RELEASE_STORE_FILE=unix-release-key.keystore
#     MYAPP_RELEASE_KEY_ALIAS=<alias>
#     MYAPP_RELEASE_STORE_PASSWORD=<store password>
#     MYAPP_RELEASE_KEY_PASSWORD=<key password>
#
# This is the same "secret on the box" pattern the keystore itself already uses:
# the .keystore is gitignored and staged from /var/lib/jenkins/.android at build
# time. The passwords were the one half of that pair still being committed.
#
# `assembleDebug` and every non-release task work fine without them — see the
# guard in app/build.gradle. Only `assembleRelease` requires them, and it fails
# with a message naming the file to create rather than a Gradle stacktrace.
